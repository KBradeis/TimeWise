<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — TimeWise</title>
  <meta name="robots" content="noindex" />

  <!-- Favicon (SVG for modern browsers, .ico fallback for older ones) -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />

  <!-- Schibsted Grotesk (headings), Atkinson Hyperlegible Next (reading), IBM Plex Mono (times); system fallbacks if offline -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=IBM+Plex+Mono:wght@500&family=Schibsted+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <p class="not-found-code time">404</p>
      <h1>This page isn't on the schedule.</h1>
      <p>
        The link might be old or have a typo. Everything else is where you left it.
      </p>
      <div class="not-found-actions">
        <a href="index.html" class="btn btn-primary btn-large">Go to the home page</a>
        <a href="try.html" class="btn btn-secondary btn-large">Open the demo</a>
      </div>
    </div>
  </main>

  <!-- Same Cloudflare Web Analytics beacon as index.html — see the comment there. -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "YOUR_CLOUDFLARE_WEB_ANALYTICS_TOKEN"}'></script>
</body>
</html>
